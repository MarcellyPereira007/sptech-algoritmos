        <div class="area">

            <button onclick="addJogoInicio()">Adicionar jogo no início</button>

            <div id="resultado4" class="resultado"></div>
        </div>

        <div class="area">
            <h2>Função: Alterar Lista</h2>
            <label for="ipt_indiceInicial">A partir de que índice será alterado?</label>

            <div id="resultado4" class="resultado"></div>
        </div>


    </div>
</body>

<script src="funcoes-lista.js"></script>

    }

    function addJogoInicio () {

        let novo_vetor = adicionarNoInicio(jogos, jogo_add);

        resultado4.innerHTML = `Resultado atualizado: ${novo_vetor}`;
    }
