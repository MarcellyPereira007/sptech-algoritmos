<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet">
    <title>Frase Numerada</title>
</head>

<body>
    <header>
        <h1>3. Frase Numerada</h1>
    </header>

    <div class="enunciado">
        <p>
            Refaça o programa anterior de tal forma que, antes de cada frase apareça um contador. Ex: Se a frase
            digitada foi “Boa Tarde” a página ficará assim: <br><br>

            1. Boa tarde <br><br>

            2. Boa tarde <br><br>

            ... <br><br>

            7. Boa tarde
        </p>
    </div>

    <div class="entradas">
        <label>Diga algo sobre a matéria de algoritmos</label> <br>
        <input type="text" id="ipt_frase" placeholder="Digite a frase aqui"><br><br>

        <button onclick="repetir()">Diga</button>
    </div>

    <div class="div_mensagem" id="div_mensagem"></div>
</body>

</html>
<script>
    function repetir() {
        div_mensagem.innerHTML = ``
        let frase = document.getElementById('ipt_frase').value;
        let contador = 1;

        while (contador <= 7) {
            div_mensagem.innerHTML += `<br>${contador}. ${frase}`;
            contador++
        }
    }

</script>
