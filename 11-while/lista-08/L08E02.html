<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet">
    <title>Frase repetitiva</title>
</head>

<body>
    <header>
        <h1>2. Frase repetitiva</h1>
    </header>

    <div class="enunciado">
        <p>
            Crie um programa o qual: <br><br>

            a) Tenha um botão "Diga algo sobre a matéria de Algoritmos"; <br><br>

            b) Ao clicar nele, mostre na própria página 7 vezes uma frase a sua escolha, uma abaixo da outra.
        </p>
    </div>

    <div class="entradas">
        <label>Diga algo sobre a matéria de algoritmos</label> <br>
        <input type="text" id="ipt_frase" placeholder="Digite a frase aqui"><br><br>

        <button onclick="repetir()">Diga</button>
    </div>

    <div class="div_mensagem" id="div_mensagem"></div>
</body>

</html>
<script>
    function repetir(){
        div_mensagem.innerHTML = ``
        let frase = document.getElementById('ipt_frase').value;
        let contador = 1;

        while (contador <= 7) {
            div_mensagem.innerHTML += `<br>${frase}`;
            contador++
        }
    }

</script>
