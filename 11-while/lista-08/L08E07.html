<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet">
    <title>Viva o 7!</title>
</head>

<body>
    <header>
        <h1>7. Viva o 7! </h1>
    </header>

    <div class="enunciado">
        <p>
            Crie um programa o qual: <br><br>

            a) Receba um número (tem que estar entre 0 e 200);<br><br>

            b) Ter um botão chamado "Viva o 7!"<br><br>

            c) Ao clicar nesse botão, devem aparecer todos os múltiplos de 7 entre 0 e o número informado em a)
        </p>
    </div>

    <div class="entradas">
        <label>Digite um número</label> <br>
        <input type="number" id="ipt_numero" placeholder="Digite o número aqui"><br><br>

        <button onclick="sete()">Viva o 7!</button>
    </div>

    <div class="div_mensagem" id="div_mensagem"></div>
</body>

</html>
<script>

    function sete() {
        div_mensagem.innerHTML = ``
        var numero = Number(ipt_numero.value);
        let contador = 0;

        if (numero < 0 || numero > 200) {
            alert("Digite um número entre 0 e 200");
        } else {
            while (contador <= numero) {
                if (contador % 7 == 0) {
                    div_mensagem.innerHTML += `<br>${contador}`;
                }
                contador++;
            }
        }
    }

</script>
