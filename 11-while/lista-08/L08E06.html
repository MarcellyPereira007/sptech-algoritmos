<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet">
    <title>Múltiplos de 5</title>
</head>

<body>
    <header>
        <h1>6. Múltiplos de 5</h1>
    </header>

    <div class="enunciado">
        <p>
            Crie um programa o qual: <br><br>

            a) Receba do usuário um número (tem que ser entre 20 e 100)<br><br>

            b) Ao clicar num botão "Adoro múltiplos de 5"...<br><br>

            c) Exiba, debaixo do botão, todos os múltiplos de 5 entre 0 e o número informado em a), um embaixo do outro.
            Ex: 5, 10, 15, 20...
        </p>
    </div>

    <div class="entradas">
        <label>Digite um número:</label> <br>
        <input type="number" id="ipt_numero" placeholder="Digite o número aqui"><br><br>

        <button onclick="multiplos()">Adoro múltiplos de 5</button>
    </div>

    <div class="div_mensagem" id="div_mensagem"></div>
</body>

</html>
<script>


    function multiplos() {
        div_mensagem.innerHTML = ``
        var numero = Number(ipt_numero.value);
        let contador = 0;

        if (numero < 20 || numero > 100) {
            alert("Digite um número entre 20 e 100");
        } else {
            while (contador <= numero) {
                if (contador % 5 == 0) {
                    div_mensagem.innerHTML += `<br>${contador}`;
                }
                contador++;
            }
        }

    }


</script>
